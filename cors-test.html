<!doctype html><meta charset="utf-8"><title>CORS test</title>
<pre id="o">running…</pre>
<script>
const out = document.getElementById('o'); const log = s => out.textContent += '\n' + s;
const base = 'https://elevation.nationalmap.gov/arcgis/rest/services/3DEPElevation/ImageServer';
(async () => {
  for (const [name, url] of [
    ['service info', base + '?f=json'],
    ['exportImage tiff', base + '/exportImage?bbox=-92.30,34.74,-92.299,34.741&bboxSR=4326&imageSR=4326&size=20,20&format=tiff&pixelType=F32&interpolation=RSP_BilinearInterpolation&f=image'],
  ]) {
    try { const r = await fetch(url); const b = await r.arrayBuffer();
      log(name + ': OK ' + r.status + ' ' + r.headers.get('content-type') + ' ' + b.byteLength + ' bytes'); }
    catch (e) { log(name + ': FAILED ' + e); }
  }
  log('done');
})();
</script>
