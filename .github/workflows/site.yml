name: Build site and context data

# Publishes the app plus compact OpenStreetMap context tiles for Arkansas.
# Weekly refresh (Mondays) and on every push; the OSM tiles are cached per ISO week
# so ordinary pushes don't re-download the Arkansas extract.
on:
  schedule:
    - cron: '17 9 * * 1'
  push:
    branches: [main]
    paths-ignore:
      - 'revit-plugin/**'
      - '.github/workflows/revit-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Week key
        id: wk
        run: echo "key=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restore context tiles
        id: cache
        uses: actions/cache@v4
        with:
          path: _ctx
          # Manual runs ("Update data") always rebuild from a fresh download.
          key: ctx-${{ steps.wk.outputs.key }}-${{ hashFiles('tools/build_data.py', 'tools/build_index.py', 'context-states.txt') }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'wk' }}

      - name: Build context tiles for each state in context-states.txt
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          rm -rf _ctx && mkdir -p _ctx
          for st in $(grep -v '^\s*#' context-states.txt | tr -d '\r' | awk 'NF{print $1}'); do
            echo "::group::$st"
            curl -sSfL -o "$st.osm.pbf" "https://download.geofabrik.de/north-america/us/$st-latest.osm.pbf" || { echo "::warning::No Geofabrik extract for '$st'"; echo "::endgroup::"; continue; }
            SRC_DATE=$(osmium fileinfo -g header.option.osmosis_replication_timestamp "$st.osm.pbf" | cut -c1-10)
            osmium tags-filter "$st.osm.pbf" w/amenity=parking w/area:highway w/footway=sidewalk w/highway=pedestrian,footway,service,residential,unclassified -o "$st.sel.osm.pbf"
            osmium export "$st.sel.osm.pbf" -f geojsonseq --geometry-types=linestring,polygon -a id -o "$st.geojsonseq"
            python3 tools/build_data.py "$st.geojsonseq" "_ctx/$st" "${SRC_DATE:-unknown}"
            rm -f "$st.osm.pbf" "$st.sel.osm.pbf" "$st.geojsonseq"
            echo "::endgroup::"
          done
          python3 tools/build_index.py _ctx

      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_ctx' --exclude '_site' --exclude 'tools' --exclude 'revit-plugin' --exclude 'context-states.txt' --exclude '.keepalive' ./ _site/
          mkdir -p _site/c9 && cp -r _ctx/. _site/c9/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub pauses scheduled workflows after 60 days without repository activity.
  # On the first scheduled run of each month, commit a tiny date stamp so the schedule stays active.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Monthly keepalive commit
        run: |
          if [ "$(date -u +%d)" -le 7 ]; then
            date -u +%Y-%m-%d > .keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive
            git commit -m "Keepalive: $(date -u +%Y-%m) [skip ci]" && git push || echo "nothing to commit"
          fi
